<!doctype html>
<html lang="pt-AO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terra Viva — sem rede</title>
    <meta name="theme-color" content="#121a15" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />
  </head>
  <body data-titulo="offline.tituloPagina">
    <div class="grao" aria-hidden="true"></div>
    <header class="topo">
      <div class="topo__interior">
        <a class="marca" href="index.html">
          <svg class="marca__selo" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-opacity="0.22" />
            <circle cx="20" cy="20" r="13" fill="none" stroke="var(--terra)" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="55 100" pathLength="100" transform="rotate(-90 20 20)" />
            <circle cx="20" cy="20" r="7.5" fill="none" stroke="var(--dourado)" stroke-width="3" stroke-linecap="round" stroke-dasharray="62 100" pathLength="100" transform="rotate(40 20 20)" />
            <circle cx="20" cy="20" r="2.4" fill="currentColor" />
          </svg>
          <span>
            <span class="marca__nome">Terra Viva</span>
            <span class="marca__lema">Calendário vivo</span>
          </span>
        </a>
        <div class="idioma" role="group" aria-label="Idioma" data-i18n-attr="aria-label:a11y.idioma">
          <button class="idioma__botao" type="button" data-lingua="pt" aria-pressed="true" lang="pt">PT</button>
          <button class="idioma__botao" type="button" data-lingua="en" aria-pressed="false" lang="en">EN</button>
        </div>
      </div>
    </header>

    <main class="pagina">
      <div class="conteudo">
        <div class="pagina__cabeca">
          <p class="eyebrow" data-i18n="offline.etiqueta">Sem rede</p>
          <h1 data-i18n="offline.paginaTitulo">Sem rede, mas com os dados que já tens</h1>
        </div>
        <div class="prosa">
          <p data-i18n="offline.paginaTexto">
            Esta página ainda não está guardada no teu telemóvel. Abre a Terra Viva uma vez com
            internet e volta depois: a aplicação fica disponível offline.
          </p>
          <p><a class="botao botao--pequeno" href="index.html" data-i18n="offline.voltar">Voltar ao início</a></p>
        </div>
      </div>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
